name: Regenerate Calendar
on:
  push:
    paths:
      - 'spec.md'
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate calendar
        run: node generator/generate.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "2026-2027 Pack 127 Calendar.docx"
          git diff --quiet --cached || git commit -m "Auto-generated calendar"
          git push
